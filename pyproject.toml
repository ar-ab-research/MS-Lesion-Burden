[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mslb"
version = "0.1.0"
description = "MS lesion burden from T1-weighted MRI, and its associations with functional connectivity, urodynamic and symptom data."
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "nibabel>=5.2",
    "pyyaml>=6",
    "statsmodels>=0.14",
    "scikit-image>=0.22",
    "matplotlib>=3.8",
    "mindglide>=1.3,<2",
    "antspyx>=0.6",
    "templateflow>=24.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mslb = "mslb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs a real registration, a few seconds"]
